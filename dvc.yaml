# Pipeline DVC — Sistema de Recomendação de Produtos
# ---------------------------------------------------------------------------
# Grafo: perfil_dados audita a base bruta; preparacao_dados gera o parquet
# tratado, consumido em PARALELO por treinamento_modelo e treinamento_ensemble
# (estágios independentes entre si):
#
#     perfil_dados       (auditoria de qualidade — independe da preparação)
#
#     preparacao_dados ──┬──> treinamento_modelo
#                       └──> treinamento_ensemble
#
#     benchmark_publico_sc_base_03  (ramo independente — base pública REAL)
#
#     perfil_sc_base_04             (ramo independente — log de eventos em escala)
#
#     benchmark_escala_sc_base_04   (ramo independente — régua blindada em escala)
#
# Cada estágio declara as dependências de código (scripts/config) e de dados,
# garantindo que o DVC só re-execute o necessário quando algo mudar.
# ---------------------------------------------------------------------------
stages:

  perfil_dados:
    desc: "Audita a base bruta de sc_base_01 (volume, esquema, densidade, cauda longa, limitações)."
    cmd: python -m src.scripts.perfil_dados
    deps:
      - src/scripts/perfil_dados.py
      - src/config/paths.py
      - dados/sc_base_01/sc_base_01_bruto.csv
    metrics:
      - report/perfil_sc_base_01.json:
          cache: false

  preparacao_dados:
    desc: "Converte o CSV bruto em Parquet tratado (nulos de 'Postal Code' + downcast)."
    cmd: python -m src.scripts.preparar_dados
    deps:
      - src/scripts/preparar_dados.py
      - src/config/paths.py
      - src/config/auxiliares_ml.py
      - dados/sc_base_01/sc_base_01_bruto.csv
    outs:
      - dados/sc_base_01/sc_base_01_tratado.parquet

  treinamento_modelo:
    desc: "Treina o recomendador híbrido popularity-first (NeuMF + prior) e salva modelo + encoders."
    cmd: python -m src.scripts.otimizacao_modelo
    deps:
      - src/scripts/otimizacao_modelo.py
      - src/config/paths.py
      - src/config/auxiliares_ml.py
      - src/config/model_utils.py
      - src/config/mlflow_tracking.py
      - dados/sc_base_01/sc_base_01_tratado.parquet
    outs:
      - models/best_model_recomendacao_otimizado.keras
      - models/hybrid_config_otimizado.pkl
      - models/customer_encoder_otimizado.pkl
      - models/product_encoder_otimizado.pkl
      - models/category_encoder_otimizado.pkl
      - models/subcategory_encoder_otimizado.pkl

  treinamento_ensemble:
    desc: "Treina o ensemble (deep learning + ML clássico) e salva em models/ensemble/."
    cmd: python -m src.scripts.modelo_ensemble
    deps:
      - src/scripts/modelo_ensemble.py
      - src/config/paths.py
      - src/config/auxiliares_ml.py
      - dados/sc_base_01/sc_base_01_tratado.parquet
    outs:
      - models/ensemble/

  benchmark_publico_sc_base_03:
    desc: "Benchmark sobre a base pública REAL sc_base_03 (NeuMF + baselines, sem teto oracle)."
    cmd: python -m src.scripts.benchmark_sc_base_03
    deps:
      - src/scripts/benchmark_sc_base_03.py
      - src/config/sc_base_03_data.py
      - src/config/model_utils.py
      - src/config/mlflow_tracking.py
      - src/config/paths.py
      - dados/sc_base_03/events.csv
      - dados/sc_base_03/item_properties_part1.csv
      - dados/sc_base_03/item_properties_part2.csv
      - dados/sc_base_03/category_tree.csv
    outs:
      - dados/sc_base_03/benchmark_sc_base_03.parquet
    metrics:
      - report/benchmark_sc_base_03_metricas.json:
          cache: false

  perfil_sc_base_04:
    desc: "Audita o log de eventos em escala de sc_base_04 em blocos (volume, tipos, cardinalidade, densidade, cauda longa, limitações)."
    cmd: python -m src.scripts.perfil_sc_base_04
    deps:
      - src/scripts/perfil_sc_base_04.py
      - src/config/paths.py
      - dados/sc_base_04/2019-Oct.csv
      - dados/sc_base_04/2019-Nov.csv
    metrics:
      - report/perfil_sc_base_04.json:
          cache: false

  benchmark_escala_sc_base_04:
    desc: "Benchmark de escala sobre o log de eventos real sc_base_04 (baselines fortes + régua blindada com IC 95%)."
    cmd: python -m src.scripts.benchmark_sc_base_04
    deps:
      - src/scripts/benchmark_sc_base_04.py
      - src/config/avaliacao_ranking.py
      - src/config/model_utils.py
      - src/config/paths.py
      - dados/sc_base_04/2019-Oct.csv
      - dados/sc_base_04/2019-Nov.csv
    metrics:
      - report/benchmark_sc_base_04_metricas.json:
          cache: false
