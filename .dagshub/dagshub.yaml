name: Sistema de Recomendação
description: Sistema de recomendação de produtos com explicabilidade usando SHAP e ambiente MLOps completo

integrations:
  mlflow:
    tracking_uri: https://dagshub.com/flaviohenriquehb777/Sistema_Recomendacao_Arquitetura-MLOps.mlflow
    artifact_root: artifacts

  dvc:
    remote: dagshub
    auto_push: true

artifacts:
  - path: models/
    type: model

  - path: report/
    type: report

environments:
  - name: development
    description: Ambiente de desenvolvimento local

  - name: production
    description: Ambiente de produção

tags:
  - recomendacao
  - shap
  - explicabilidade
  - mlops
  - tensorflow
