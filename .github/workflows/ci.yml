name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # uv é a fonte única do ambiente (pyproject.toml + uv.lock). O setup-uv
    # instala o Python 3.11 (versão exigida em requires-python) e habilita o cache.
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.11'
        enable-cache: true

    # --frozen garante que o lock não seja alterado silenciosamente no CI.
    - name: Install dependencies (uv sync)
      run: uv sync --frozen

    - name: Lint with ruff
      run: uv run ruff check .

    # Black é obrigatório apenas no código novo (serving/ + testes da API).
    # O legado de src/ ainda não está 100% no padrão black e será formatado
    # separadamente, para não misturar um diff grande com este escopo.
    - name: Check code formatting (black)
      run: uv run black --check serving/ tests/test_api.py

    - name: Run tests (pytest)
      run: uv run python -m pytest tests/ -v --tb=short

  validate-structure:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate project structure
      run: |
        echo "Validating project structure..."

        # Check main directories
        for dir in src tests scripts; do
          if [ -d "$dir" ]; then
            echo "✓ Directory $dir exists"
          else
            echo "⚠ Directory $dir missing"
          fi
        done

        # Check important files
        for file in pyproject.toml uv.lock README.md; do
          if [ -f "$file" ]; then
            echo "✓ File $file exists"
          else
            echo "⚠ File $file missing"
          fi
        done

        echo "✓ Structure validation completed"
